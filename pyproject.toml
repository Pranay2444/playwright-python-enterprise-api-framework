[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-python-enterprise-api-framework"
version = "0.5.0"
description = "An incremental Playwright Python API testing portfolio, starting with DummyJSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.51,<2",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
lab = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.12,<3",
  "pyotp>=2.9,<3", "python-multipart>=0.0.20,<1",
]
dev = [
  "pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2",
  "hypothesis>=6.130,<7", "pytest-xdist>=3.6,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_framework = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --tb=short"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
junit_logging = "no"
markers = [
  "external: contacts a public service; requires --run-external",
  "smoke: critical service checks",
  "regression: broader behavior coverage",
  "workflow: chained API calls, including simulated cart creation",
  "contract: response schema or typed model compatibility",
  "negative: invalid requests and authentication rejection",
  "boundary: pagination, empty results, and minimum valid quantity",
  "booker: Restful Booker persistent booking scenarios",
  "reqres: ReqRes demo and project scenarios",
  "reqres_demo: ReqRes public fixture API; no persistence",
  "reqres_project: ReqRes private project records; requires configured manage key",
  "lab: owned FastAPI lab; never a public service",
  "auth: password, MFA, token, and session policy",
  "documents: upload, metadata, checksum, and download policy",
  "database: independent persistence and audit checks",
  "security: bounded owned-environment access and input rejection",
  "property: bounded generated-input policy checks",
  "domain(name): defect routing: authentication, documents, persistence, contracts, framework, public-apis",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
