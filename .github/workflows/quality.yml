name: API framework quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the live DummyJSON suite as well
        required: true
        default: false
        type: boolean
      run_live_booker:
        description: Run the live Restful Booker lifecycle suite as well
        required: true
        default: false
        type: boolean
      run_live_reqres_demo:
        description: Run the live ReqRes public demo suite as well
        required: true
        default: false
        type: boolean
      run_live_reqres_project:
        description: Run live ReqRes project CRUD with configured secrets and variables
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python scripts/check_wheel.py
      - run: python scripts/check_docs.py
      - run: python -m pytest -m "not external and not deployment" --defect-dir=reports/defects --junitxml=reports/local-results.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: local-results-${{ matrix.python-version }}
          path: |
            reports/*.xml
            reports/defects/**/*.json
          retention-days: 7

  owned-lab:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAB_TEST_DATABASE_URL: postgresql+psycopg://lab:lab-disposable-password@127.0.0.1:5440/portfolio_lab
      LAB_SMTP_HOST: 127.0.0.1
      LAB_SMTP_PORT: "1025"
      LAB_MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/init_lab.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify application process runs without root
        run: docker compose exec -T app python -c "from pathlib import Path; text = Path('/proc/1/status').read_text(); assert next(line for line in text.splitlines() if line.startswith('Uid:')).split()[1] == '10001'"
      - name: PostgreSQL and real SMTP integration with isolated workers
        run: python -m pytest tests/lab -n 2 --lab-postgres --lab-mailpit --defect-dir=reports/defects --junitxml=reports/postgres-mailpit.xml
      - name: Installed application container workflow
        run: python -m pytest tests/deployment --lab-container --defect-dir=reports/defects --junitxml=reports/container.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: owned-lab-results
          path: |
            reports/*.xml
            reports/defects/**/*.json
          retention-days: 7
      - name: Stop this job's disposable stack
        if: always()
        run: docker compose down --volumes

  live-dummyjson:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -m "external and not booker and not reqres" --run-external --junitxml=reports/live-results.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: live-dummyjson-results
          path: reports/*.xml
          retention-days: 7

  live-reqres-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_reqres_demo
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -m "reqres_demo and external" --run-external --junitxml=reports/reqres-demo-results.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: live-reqres-demo-results
          path: reports/*.xml
          retention-days: 7

  live-reqres-project:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_reqres_project
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      REQRES_PROJECT_ID: ${{ vars.REQRES_PROJECT_ID }}
      REQRES_COLLECTION: ${{ vars.REQRES_COLLECTION || 'products' }}
      REQRES_ENV: ${{ vars.REQRES_ENV || 'prod' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - name: Require project configuration
        run: python -c "from api_framework.config import ReqResSettings; ReqResSettings.from_env().require_project()"
      - run: python -m pytest -m "reqres_project and external" --run-external --junitxml=reports/reqres-project-results.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: live-reqres-project-results
          path: reports/*.xml
          retention-days: 7

  live-booker:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_booker
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -m "booker and external" --run-external --junitxml=reports/booker-results.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: live-booker-results
          path: reports/*.xml
          retention-days: 7
